<text x="735" y="372" font-size="14" font-weight="700" text-anchor="middle" fill="#C2410C">flanco: la UART guarda la H</text>
<text x="16" y="402" font-size="15" fill="#16202E">Ciclos 1 y 2: el CPU lee la instrucción sw en la RAM (dirección 0x48, cs = RAM).</text>
<text x="16" y="430" font-size="15" fill="#16202E">Ciclo 3: pone la dirección de la UART, la letra y wr = 1. Solo cs de la UART vale 1.</text>
<text x="16" y="458" font-size="15" fill="#16202E">En el flanco al final del ciclo 3 la UART guarda el dato. Simulación real de hola.c.</text>
