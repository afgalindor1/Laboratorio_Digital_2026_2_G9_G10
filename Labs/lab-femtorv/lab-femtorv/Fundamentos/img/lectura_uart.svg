<text x="647.5" y="144.0" font-size="14" text-anchor="middle" fill="#16202E" font-family="Menlo, Consolas, monospace">EJECUTAR</text>
<polygon points="738,139.0 746,126 899,126 907,139.0 899,152 746,152" fill="#EEF3FA" stroke="#2563A8" stroke-width="1.6"/>
<text x="822.5" y="144.0" font-size="14" text-anchor="middle" fill="#16202E" font-family="Menlo, Consolas, monospace">ESPERAR MEM</text>
<text x="16" y="190.0" font-size="15" fill="#16202E" font-family="Menlo, Consolas, monospace">mem_addr</text>
<polygon points="213,185.0 221,172 549,172 557,185.0 549,198 221,198" fill="#EEF3FA" stroke="#2563A8" stroke-width="1.6"/>
<text x="385.0" y="190.0" font-size="14" text-anchor="middle" fill="#16202E" font-family="Menlo, Consolas, monospace">0x0000_0058</text>
<polygon points="563,185.0 571,172 899,172 907,185.0 899,198 571,198" fill="#EEF3FA" stroke="#2563A8" stroke-width="1.6"/>
<text x="735.0" y="190.0" font-size="14" text-anchor="middle" fill="#16202E" font-family="Menlo, Consolas, monospace">0x0040_0010</text>
<text x="16" y="236.0" font-size="15" fill="#16202E" font-family="Menlo, Consolas, monospace">rd (mem_rstrb)</text>
<polyline fill="none" stroke="#2563A8" stroke-width="2.5" points="210,218 385,218 385,218 385,244 560,244 560,244 560,218 735,218 735,218 735,244 910,244"/>
