<text x="385.0" y="282.0" font-size="14" text-anchor="middle" fill="#16202E" font-family="Menlo, Consolas, monospace">1000000  RAM</text>
<polygon points="563,277.0 571,264 899,264 907,277.0 899,290 571,290" fill="#EEF3FA" stroke="#2563A8" stroke-width="1.6"/>
<text x="735.0" y="282.0" font-size="14" text-anchor="middle" fill="#16202E" font-family="Menlo, Consolas, monospace">0000001  UART</text>
<text x="16" y="328.0" font-size="15" fill="#16202E" font-family="Menlo, Consolas, monospace">mem_rdata</text>
<polygon points="213,323.0 221,310 549,310 557,323.0 549,336 221,336" fill="#EEF3FA" stroke="#2563A8" stroke-width="1.6"/>
<text x="385.0" y="328.0" font-size="14" text-anchor="middle" fill="#16202E" font-family="Menlo, Consolas, monospace">instrucción</text>
<line x1="563" y1="323.0" x2="732" y2="323.0" stroke="#D9D6CC" stroke-width="2"/>
<polygon points="738,323.0 746,310 899,310 907,323.0 899,336 746,336" fill="#EEF3FA" stroke="#2563A8" stroke-width="1.6"/>
<text x="822.5" y="328.0" font-size="14" text-anchor="middle" fill="#16202E" font-family="Menlo, Consolas, monospace">0x0000_0200</text>
<line x1="735" y1="40" x2="735" y2="354" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="735" y="372" font-size="14" font-weight="700" text-anchor="middle" fill="#C2410C">flanco: la UART pone su respuesta</text>
<text x="16" y="402" font-size="15" fill="#16202E">Ciclo 3: el CPU pone la dirección del registro CONTROL y rd = 1.</text>
<text x="16" y="430" font-size="15" fill="#16202E">En el flanco al final del ciclo 3 la UART copia su estado a d_out.</text>
<text x="16" y="458" font-size="15" fill="#16202E">Ciclo 4: el dato llega al CPU por mem_rdata. 0x200 = bit 9 en 1: "ocupada, pregunta otra vez".</text>
</svg>